<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Coba demo game langsung di browser dan lihat file yang tersedia.">
  <title>Webku</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/kartu.css">
  <script src="/js/toko.js"></script>
</head>
<body>
  <header>
    <h1>RizkyDigital</h1>
    <p>Kumpulan Storybook dan Worksheet anak.</p>
  </header>

  <nav>
    <a href="/index.html">Beranda</a>
    <a href="/index.html#bagian-tools">Tools</a>
    <a href="/index.html#bagian-storybook">Storybook</a>
    <a href="/index.html#bagian-game">Game</a>
    <a href="/index.html#bagian-file">Worksheet</a>
  </nav>

  <main class="lebar">
    <section class="bagian" id="bagian-tools">
      <h2>Tools</h2>
      <p class="kosong" id="status-tools">Memuat tools...</p>
      <div class="grid-kartu" id="grid-tools"></div>
    </section>
    <section class="bagian" id="bagian-storybook">
      <h2>Storybook</h2>
      <p class="kosong" id="status-storybook">Memuat storybook...</p>
      <div class="grid-kartu" id="grid-storybook"></div>
    </section>

    <section class="bagian" id="bagian-game">
      <h2>Game</h2>
      <p class="kosong" id="status-game">Memuat game...</p>
      <div class="grid-kartu" id="grid-game"></div>
    </section>

    <section class="bagian" id="bagian-file">
      <h2>Worksheet</h2>
      <p class="kosong" id="status-file">Memuat file...</p>
      <div class="grid-kartu" id="grid-file"></div>
    </section>

  </main>

  <script>
    function href(tipe, id) {
      return "/detail.html?tipe=" + tipe + "&id=" + encodeURIComponent(id);
    }

    async function muat(tipe, ambil, kosongTeks) {
      const status = document.getElementById("status-" + tipe);
      const grid = document.getElementById("grid-" + tipe);
      try {
        const daftar = await ambil();
        status.textContent = daftar.length ? "" : kosongTeks;
        daftar.forEach((p) => grid.appendChild(buatKotak(p, href(tipe, p.id))));
      } catch (err) {
        status.textContent = err.message;
      }
    }

    // Filter bagian sesuai menu: #bagian-tools / #bagian-storybook / #bagian-game / #bagian-file
    // menampilkan satu bagian saja; Beranda (tanpa #) menampilkan semuanya.
    function terapkanFilter() {
      const id = location.hash.slice(1);
      const semua = document.querySelectorAll(".bagian");
      const ada = Array.prototype.some.call(semua, (s) => s.id === id);
      semua.forEach((s) => { s.hidden = ada && s.id !== id; });
      if (ada) window.scrollTo(0, 0);
    }
    window.addEventListener("hashchange", terapkanFilter);
    terapkanFilter();

    muat("storybook", ambilStorybook, "Belum ada storybook.");
    muat("game", ambilGame, "Belum ada game.");
    muat("file", ambilFile, "Belum ada file.");
    muat("tools", ambilTools, "Belum ada tools.");
  </script>
</body>
</html>
