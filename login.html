<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - Webku</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-box { max-width: 360px; margin: 64px auto; text-align: center; }
    .login-box input {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 8px;
      border: none;
      margin: 12px 0;
    }
    #pesan { min-height: 1.6em; color: #f87171; }
  </style>
</head>
<body>
  <header>
    <h1>Webku</h1>
  </header>

  <main>
    <div class="login-box">
      <h2>Masuk dengan kode</h2>
      <p>Masukkan kode yang diberikan kepadamu.</p>
      <input id="kode" type="text" autocomplete="off" placeholder="KODE" maxlength="40">
      <button class="btn" id="btn-masuk">Masuk</button>
      <p id="pesan"></p>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import {
      getAuth,
      signInWithCustomToken,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { firebaseConfig } from "/js/firebase-config.js";

    const auth = getAuth(initializeApp(firebaseConfig));
    const pesan = document.getElementById("pesan");
    const tombol = document.getElementById("btn-masuk");
    const input = document.getElementById("kode");

    // Kalau sudah login, langsung ke beranda.
    onAuthStateChanged(auth, (user) => {
      if (user) location.replace("/");
    });

    async function masuk() {
      const code = input.value.trim();
      if (!code) {
        pesan.textContent = "Masukkan kodenya dulu.";
        return;
      }
      tombol.disabled = true;
      pesan.textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Gagal masuk.");
        await signInWithCustomToken(auth, data.token);
        location.replace("/");
      } catch (err) {
        pesan.textContent = err.message;
        tombol.disabled = false;
      }
    }

    tombol.addEventListener("click", masuk);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") masuk();
    });
  </script>
</body>
</html>
