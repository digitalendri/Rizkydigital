.fx-shake{animation:fxs .5s}@keyframes fxs{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

.fx-pop{animation:fxo .6s}@keyframes fxo{40%{transform:scale(1.12)}70%{transform:scale(.97)}}
</style><script>
function fx(t,h){if(!t||t==="none")return;if(t==="shake"||t==="flash"||t==="pop"){if(h){h.classList.remove("fx-"+t);void h.offsetWidth;h.classList.add("fx-"+t)}return}
