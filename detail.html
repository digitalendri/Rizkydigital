<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detail - Webku</title>
  <style>html { visibility: hidden; }</style>
  <script type="module" src="/js/auth-guard.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/kartu.css">
  <link rel="stylesheet" href="css/detail.css">
  <script src="js/toko.js"></script>
</head>
<body>
  <header>
    <h1>Webku</h1>
    <nav>
      <a href="index.html">Beranda</a>
      <a href="index.html#bagian-game" data-izin="game">Game</a>
      <a href="index.html#bagian-file" data-izin="file game">File</a>
      <a href="#" id="btn-keluar">Keluar</a>
    </nav>
  </header>

  <main class="lebar">
    <a class="kembali" href="index.html">&larr; Kembali</a>
    <p class="kosong" id="status">Memuat...</p>
    <div id="isi"></div>
  </main>

  <div class="lightbox" id="lightbox"><img alt=""></div>

  <footer>&copy; 2026 Webku</footer>

  <script>
    const params = new URLSearchParams(location.search);
    const tipe = params.get("tipe") === "game" ? "game" : "file";
    const id = params.get("id") || "";

    function tombol(teks, href, alt) {
      if (linkAman(href)) {
        const a = document.createElement("a");
        a.className = "btn" + (alt ? " btn-alt" : "");
        a.textContent = teks;
        a.href = href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        return a;
      }
      const s = document.createElement("span");
      s.className = "btn nonaktif";
      s.textContent = teks + " (belum tersedia)";
      return s;
    }

    function tampilkan(item) {
      document.title = item.judul + " - Webku";
      const isi = document.getElementById("isi");

      const detail = document.createElement("div");
      detail.className = "detail";

      const cover = document.createElement("div");
      cover.className = "cover-besar";
      cover.textContent = (item.judul || "?").trim().charAt(0).toUpperCase();
      pasangGambar(cover, item.cover, 1000);

      const teks = document.createElement("div");
      const h = document.createElement("h2");
      h.textContent = item.judul;
      teks.appendChild(h);
      if (item.deskripsi) {
        const p = document.createElement("p");
        p.className = "deskripsi";
        p.textContent = item.deskripsi;
        teks.appendChild(p);
      }

      const aksi = document.createElement("div");
      aksi.className = "aksi";
      if (tipe === "game") {
        const demo = document.createElement("a");
        demo.className = "btn";
        demo.textContent = "Main Demo";
        demo.href = item.link;
        aksi.appendChild(demo);
        aksi.appendChild(tombol("Unduh Versi Lengkap", item.linkBayar, true));
      } else {
        aksi.appendChild(tombol("Unduh", item.linkBayar));
      }
      teks.appendChild(aksi);

      detail.appendChild(cover);
      detail.appendChild(teks);
      isi.appendChild(detail);

      const preview = Array.isArray(item.preview) ? item.preview : [];
      if (preview.length) {
        const galeri = document.createElement("section");
        galeri.className = "galeri";
        const h3 = document.createElement("h3");
        h3.textContent = "Preview";
        const grid = document.createElement("div");
        grid.className = "grid-preview";
        preview.forEach((url) => {
          const lembar = document.createElement("div");
          lembar.className = "lembar";
          const img = pasangGambar(lembar, url, 400);
          if (!img) return;
          lembar.addEventListener("click", () => {
            const lb = document.getElementById("lightbox");
            lb.querySelector("img").src = ubahGambar(url, 1600);
            lb.classList.add("buka");
          });
          grid.appendChild(lembar);
        });
        galeri.appendChild(h3);
        galeri.appendChild(grid);
        isi.appendChild(galeri);
      }
    }

    async function mulai() {
      const status = document.getElementById("status");
      try {
        const klaim = window.webku.klaim;
        let item;
        if (tipe === "game") {
          if (!punya(klaim, "game")) return location.replace("index.html");
          item = (await ambilGame()).find((g) => g.id === id);
        } else {
          if (!punya(klaim, "file") && !punya(klaim, "game")) {
            return location.replace("index.html");
          }
          item = (await ambilFile()).find((f) => f.id === id);
        }
        if (!item) throw new Error("Item tidak ditemukan.");
        status.textContent = "";
        tampilkan(item);
      } catch (err) {
        status.textContent = err.message;
      }
    }

    document.getElementById("lightbox").addEventListener("click", (e) => {
      e.currentTarget.classList.remove("buka");
    });

    if (window.webku) mulai();
    else window.addEventListener("webku-siap", mulai);
  </script>
</body>
</html>
