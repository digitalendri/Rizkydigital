<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detail - Webku</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/kartu.css">
  <link rel="stylesheet" href="/css/detail.css">
  <script src="/js/toko.js"></script>
  <style>
    .popup-demo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:1000;padding:12px}
    .popup-demo.buka{display:flex}
    .popup-kotak{width:100%;max-width:520px;height:100%;max-height:900px;background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
    .popup-atas{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#f3f1ff;font-size:14px}
    .popup-judul{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .popup-tab{font-size:13px}
    .popup-tutup{border:0;background:#e53935;color:#fff;border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer}
    .popup-kotak iframe{flex:1;width:100%;border:0}
  </style>
</head>
<body>
  <header>
    <h1>RizkyDigital</h1>
    <nav>
      <a href="/index.html">Beranda</a>
      <a href="/index.html#bagian-storybook">Storybook</a>
      <a href="/index.html#bagian-file">Worksheet</a>
      <a href="/index.html#bagian-tools">Tools</a>
    </nav>
  </header>

  <main class="lebar">
    <a class="btn btn-kembali" href="/index.html">&larr; Kembali</a>
    <p class="kosong" id="status">Memuat...</p>
    <div id="isi"></div>
  </main>

  <div class="lightbox" id="lightbox"><img alt=""></div>

  <div class="popup-demo" id="popupDemo">
    <div class="popup-kotak">
      <div class="popup-atas">
        <span class="popup-judul"></span>
        <a class="popup-tab" target="_blank" rel="noopener noreferrer">Buka di tab baru</a>
        <button type="button" class="popup-tutup" aria-label="Tutup">&#10005;</button>
      </div>
      <iframe title="Demo game" allow="fullscreen; autoplay"></iframe>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const tipeParam = params.get("tipe");
    const tipe = ["game", "storybook", "tools"].indexOf(tipeParam) !== -1 ? tipeParam : "file";
    const id = params.get("id") || "";

    const popupDemo = document.getElementById("popupDemo");
    const popupFrame = popupDemo.querySelector("iframe");

    function bukaDemo(url, judul) {
      popupDemo.querySelector(".popup-judul").textContent = judul || "Demo";
      popupDemo.querySelector(".popup-tab").href = url;
      popupFrame.src = url;
      popupDemo.classList.add("buka");
      document.body.style.overflow = "hidden";
    }

    function tutupDemo() {
      popupDemo.classList.remove("buka");
      popupFrame.src = "about:blank";
      document.body.style.overflow = "";
    }

    function tombol(teks, href, alt) {
      if (linkAman(href)) {
        const a = document.createElement("a");
        a.className = "btn" + (alt ? " btn-alt" : "");
        a.textContent = teks;
        a.href = href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        return a;
      }
      const s = document.createElement("span");
      s.className = "btn nonaktif";
      s.textContent = teks + " (belum tersedia)";
      return s;
    }

    function tampilkan(item) {
      document.title = item.judul + " - Webku";
      const isi = document.getElementById("isi");

      const detail = document.createElement("div");
      detail.className = "detail";

      const cover = document.createElement("div");
      cover.className = "cover-besar";
      cover.textContent = (item.judul || "?").trim().charAt(0).toUpperCase();
      pasangGambar(cover, item.cover, 1000);

      const teks = document.createElement("div");
      const h = document.createElement("h2");
      h.textContent = item.judul;
      teks.appendChild(h);

      if (item.harga) {
        const harga = document.createElement("p");
        harga.className = "harga";
        harga.textContent = item.harga;
        teks.appendChild(harga);
      }
      if (item.deskripsi) {
        const p = document.createElement("p");
        p.className = "deskripsi";
        p.textContent = item.deskripsi;
        teks.appendChild(p);
      }

      const aksi = document.createElement("div");
      aksi.className = "aksi";
      if (tipe === "game" || tipe === "storybook") {
        if (linkDemo(item.link)) {
          const demo = document.createElement("a");
          demo.className = "btn";
          demo.textContent = tipe === "storybook" ? "Baca Contoh" : "Main Demo";
          const urlDemo = item.link.indexOf("https://") === 0 ? item.link : "/" + item.link;
          demo.href = urlDemo;
          if (tipe === "game") {
            demo.addEventListener("click", (e) => {
              e.preventDefault();
              bukaDemo(urlDemo, item.judul);
            });
          }
          aksi.appendChild(demo);
        }
        aksi.appendChild(tombol(tipe === "storybook" ? "Beli Storybook" : "Unduh Versi Lengkap", item.linkBayar, true));
      } else if (tipe === "tools") {
        if (linkDemo(item.link)) {
          const buka = document.createElement("a");
          buka.className = "btn";
          buka.textContent = "Coba Tools";
          buka.href = item.link.indexOf("https://") === 0 ? item.link : "/" + item.link;
          aksi.appendChild(buka);
        }
        aksi.appendChild(tombol("Beli / Unduh", item.linkBayar, true));
      } else {
        aksi.appendChild(tombol("Beli / Unduh", item.linkBayar));
      }
      teks.appendChild(aksi);

      detail.appendChild(cover);
      detail.appendChild(teks);
      isi.appendChild(detail);

      const preview = Array.isArray(item.preview) ? item.preview : [];
      const lembarAda = preview.filter((u) => ubahGambar(u, 400));
      if (lembarAda.length) {
        const galeri = document.createElement("section");
        galeri.className = "galeri";
        const h3 = document.createElement("h3");
        h3.textContent = "Preview";
        const grid = document.createElement("div");
        grid.className = "grid-preview";
        lembarAda.forEach((url) => {
          const lembar = document.createElement("div");
          lembar.className = "lembar";
          pasangGambar(lembar, url, 400);
          lembar.addEventListener("click", () => {
            const lb = document.getElementById("lightbox");
            lb.querySelector("img").src = ubahGambar(url, 1600);
            lb.classList.add("buka");
          });
          grid.appendChild(lembar);
        });
        galeri.appendChild(h3);
        galeri.appendChild(grid);
        isi.appendChild(galeri);
      }
    }

    async function mulai() {
      const status = document.getElementById("status");
      try {
        const semua =
          tipe === "game" ? await ambilGame() :
          tipe === "storybook" ? await ambilStorybook() :
          tipe === "tools" ? await ambilTools() :
          await ambilFile();
        const item = semua.find((p) => p.id === id);
        if (!item) throw new Error("Item tidak ditemukan.");
        status.textContent = "";
        tampilkan(item);
      } catch (err) {
        status.textContent = err.message;
      }
    }

    document.getElementById("lightbox").addEventListener("click", (e) => {
      e.currentTarget.classList.remove("buka");
    });

    popupDemo.querySelector(".popup-tutup").addEventListener("click", tutupDemo);
    popupDemo.addEventListener("click", (e) => {
      if (e.target === popupDemo) tutupDemo();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && popupDemo.classList.contains("buka")) tutupDemo();
    });

    mulai();
  </script>
</body>
</html>
