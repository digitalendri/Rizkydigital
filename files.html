<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="butuh" content="file game">
  <title>File - Webku</title>
  <style>html { visibility: hidden; }</style>
  <script type="module" src="/js/auth-guard.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Webku</h1>
    <nav>
      <a href="index.html">Beranda</a>
      <a href="games.html" data-izin="game">Game</a>
      <a href="files.html" data-izin="file game">File</a>
      <a href="#" id="btn-keluar">Keluar</a>
    </nav>
  </header>

  <main>
    <h2>Daftar File</h2>
    <p id="status">Memuat daftar...</p>
    <ul class="file-list" id="daftar-file"></ul>
  </main>

  <footer>&copy; 2026 Webku</footer>

  <script>
    const API = "https://rizkydigital.vercel.app";

    async function mulai() {
      const daftar = document.getElementById("daftar-file");
      const status = document.getElementById("status");
      try {
        const token = await window.webku.user.getIdToken();
        const res = await fetch(API + "/api/files", {
          headers: { Authorization: "Bearer " + token },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Gagal memuat daftar file.");

        daftar.textContent = "";
        if (!data.files.length) {
          status.textContent = "Belum ada file untukmu.";
          return;
        }
        status.textContent = "";

        data.files.forEach((f) => {
          const li = document.createElement("li");

          const info = document.createElement("div");
          const judul = document.createElement("strong");
          judul.textContent = f.judul;
          info.appendChild(judul);
          if (f.deskripsi) {
            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = f.deskripsi;
            info.appendChild(meta);
          }

          const tombol = document.createElement("a");
          tombol.className = "btn";
          tombol.textContent = "Unduh";
          tombol.href = f.link;
          tombol.target = "_blank";
          tombol.rel = "noopener noreferrer";

          li.appendChild(info);
          li.appendChild(tombol);
          daftar.appendChild(li);
        });
      } catch (err) {
        status.textContent = err.message;
      }
    }

    if (window.webku) mulai();
    else window.addEventListener("webku-siap", mulai);
  </script>
</body>
</html>
